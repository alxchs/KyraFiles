<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Files Custom Documentation</title>
  <script>
    (function() {
      var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
      var target = "en-US";
      if (lang.indexOf("pt") === 0) {
        target = "pt-BR";
      } else if (lang.indexOf("es") === 0) {
        target = "es-ES";
      } else if (lang.indexOf("de") === 0) {
        target = "de-DE";
      }
      window.location.replace(target + "/getting-started/overview.html");
    })();
  </script>
</head>
<body>
  <h2>Files Custom Documentation</h2>
  <ul>
    <li><a href="pt-BR/getting-started/overview.html">🇧🇷 Português do Brasil</a></li>
    <li><a href="en-US/getting-started/overview.html">🇺🇸 English</a></li>
    <li><a href="es-ES/getting-started/overview.html">🇪🇸 Español</a></li>
    <li><a href="de-DE/getting-started/overview.html">🇩🇪 Deutsch</a></li>
  </ul>
</body>
</html>
